# /etc/sysctl.d/90-savak.conf — node-side transport tuning
#
# Why these and not more: the ladder can pick a good transport, but a kernel that hands
# every socket a 212 KB buffer cannot fill a 200 Mbps × 80 ms path (BDP ≈ 2 MB). These
# are the values that make the client-side window sizes meaningful rather than decorative.
# Check with: sysctl -e net.core.rmem_max net.ipv4.tcp_congestion_control

# --- congestion control: BBR for the TCP rungs (VLESS+Reality, AnyTLS, SS-2022).
# Hysteria2's BRUTAL is userspace pacing and does not need this, but the TCP rungs do.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- socket buffers: allow a receiver to advertise a window ≈ the path BDP.
# Without rmem_max the client's large QUIC windows are simply unacknowledged-in-full.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.netdev_max_backlog = 16384
net.core.netdev_budget = 1200
net.ipv4.udp_mem = 786432 1048576 1572864
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_rmem = 8192 262144 67108864
net.ipv4.tcp_wmem = 8192 262144 67108864
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3

# --- keep long-lived idle tunnels alive across NATs, and survive a burst of new flows
# (a phone that wakes up opens dozens of connections at once)
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# --- backward compatibility for clients that still send a window scale of 14
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_frto = 2
net.ipv4.tcp_recovery = 1
net.ipv4.tcp_early_retrans = 3
net.ipv4.tcp_autocorking = 0

# --- ECN is a trap on shaped links (some middleboxes drop ECN-capable SYNs): leave it off
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_ecn_fallback = 1

# --- IPv6: only fail over, never stall, when the path has no v6 route (common on VPS)
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
