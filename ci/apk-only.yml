name: apk

# The shortest path from "this file exists" to "savak-debug.apk is a file you can install".
# It is the minimum of ci/android-apk.yml (which also runs the engine tests, the kotlinc port
# check and the signed release) — use that one for normal CI, this one when you only want the
# binary. Nothing here invents a keystore: the debug APK is signed with the standard Android
# debug key, which is exactly what makes it installable and not distributable.

on:
  workflow_dispatch:
    inputs:
      ref: { description: 'branch to build', default: 'main', required: false }
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { SINGBOX_VERSION: 1.14.4 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-licenses: true
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10' }
      - run: export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973" && bash android/tools/build-libbox.sh
      - name: debug APK
        run: cd android && gradle --no-daemon :app:assembleDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/savak-debug.apk"
      - run: sha256sum savak-debug.apk | tee savak-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with: { name: savak-debug-apk, path: 'savak-debug.apk*', if-no-files-found: error }
      - name: attach to the release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            savak-debug.apk
            savak-debug.apk.sha256
          body: 'Debug APK built by ci/apk-only.yml — installable, not for distribution.'
