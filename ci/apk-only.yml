name: apk

# The shortest path from "this file exists" to "savak-debug.apk is a file you can install".
# It is the minimum of ci/android-apk.yml (which also runs the engine tests, the kotlinc port
# check and the signed release) — use that one for normal CI, this one when you only want the
# binary. Nothing here invents a keystore: the debug APK is signed with the standard Android
# debug key, which is exactly what makes it installable and not distributable.
#
# BUILD_APK_WITH_DEMO_BUNDLE (default true) runs `savak app-assets` first. Without it the APK
# builds fine and the app opens on "باندل موجود نیست": a bundle is signed per node, so it is not
# a committed artifact. A throwaway test build wants one; a release build must not ship a profile
# whose private key lives in CI logs — set the flag to false for anything real.

on:
  push:
    branches: ['arena/**']          # so the built file can be fetched back out of the repo
  workflow_dispatch:
    inputs:
      ref: { description: 'branch to build', default: 'main', required: false }
      with_demo_bundle:
        description: 'generate a throwaway signed bundle into assets first'
        type: boolean
        default: true
  push:
    tags: ['v*']
    # Handy while the port is still moving: a branch push that carries a bundle-shaped change
    # gets an APK without waiting for a tag. Harmless when nothing matches — the trigger is a
    # no-op unless the branch name is on the list.
    branches: ['arena/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SINGBOX_VERSION: 1.14.4
      # Only a manual run may opt into a throwaway bundle. Empty on tag runs, which is the
      # answer we want there: a tag build is the one attached to a release, and a release must
      # not ship a profile whose signing key was minted inside CI.
      BUILD_APK_WITH_DEMO_BUNDLE: ${{ github.event_name == 'workflow_dispatch' && inputs.with_demo_bundle }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref || github.ref }}' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: engine/package-lock.json }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-licenses: true
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10' }

      # The three files the app reads at startup: assets/profile.json (signed), assets/bundle.json
      # (validated per-rung configs) and security/TrustedKeys.kt (the key that must verify them).
      - name: demo bundle into assets
        if: env.BUILD_APK_WITH_DEMO_BUNDLE == 'true'
        run: |
          npm ci --prefix engine
          # app-assets validates every embedded config against the sing-box schema itself, so a
          # green step here means the assets the phone will read are ones the validator accepted.
          node engine/src/cli.js app-assets --androidDir android --hostname "demo-${GITHUB_RUN_ID}.savak.example" --mode daily

      - name: refuse a silent skip
        run: |
          if [ "$BUILD_APK_WITH_DEMO_BUNDLE" = "true" ] && [ ! -f android/app/src/main/assets/bundle.json ]; then
            echo "::error::app-assets said it wrote a bundle and there is none" >&2; exit 1
          fi

      - run: export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973" && bash android/tools/build-libbox.sh
      - name: debug APK
        run: |
          cd android && gradle --no-daemon -Psavak.libbox.version="$SINGBOX_VERSION" :app:assembleDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/savak-debug.apk"
      - run: sha256sum savak-debug.apk | tee savak-debug.apk.sha256

      # Not a formality: this is the repo's own rule that an APK without lib/<abi>/*.so is not a
      # VPN, applied to CI's own output. A green build that produced a shell fails here instead of
      # publishing something that reports "connected" while traffic goes direct.
      - name: verify the APK has a core
        run: bash android/tools/install-toolchain.sh --verify-apk "$GITHUB_WORKSPACE/savak-debug.apk"
      - uses: actions/upload-artifact@v4
        with: { name: savak-debug-apk, path: 'savak-debug.apk*', if-no-files-found: error }

      - name: publish to the apk-build branch
        # A branch instead of (only) an artifact: artifacts expire and need an authenticated
        # download, while `git clone --depth 1 -b apk-build` works from anywhere — including the
        # sandbox the code was written in, so the person who built it can verify the bytes and
        # report a hash rather than a claim. Force-pushed as a single commit, so the repo never
        # accumulates 40 MB of history.
        if: success()
        run: |
          set -euo pipefail
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config user.name 'savak-ci[bot]'
          cp "$GITHUB_WORKSPACE"/savak-debug.apk savak-debug.apk
          cp "$GITHUB_WORKSPACE"/savak-debug.apk.sha256 savak-debug.apk.sha256
          {
            echo "# savak-debug.apk — built by Actions"
            echo
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- sing-box: ${SINGBOX_VERSION}"
            echo "- built: $(date -u +%FT%TZ)"
            echo "- sha256: $(cut -d' ' -f1 savak-debug.apk.sha256)"
            echo
            echo "Signed with the Android **debug** key: installable, not distributable."
          } > PROVENANCE.md
          git add -A
          git commit -qm "apk: ${GITHUB_SHA:0:7} $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/apk-build
          echo "download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/apk-build/savak-debug.apk"
      - name: attach to the release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            savak-debug.apk
            savak-debug.apk.sha256
          body: 'Debug APK built by ci/apk-only.yml — installable, not for distribution.'
