android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AGP 8.5.2 knows compileSdk 34 as its newest; 35 is supported with a warning. Suppress it
# explicitly instead of letting a build log full of warnings hide the one that matters. Remove
# this line when AGP moves to 8.6+ and the warning goes away on its own.
android.suppressUnsupportedCompileSdk=35
